services:
    database:
        image: postgres:16
        environment:
            POSTGRES_DB: employee_training
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d employee_training']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app-network

    backend:
        build: ./employee-training-backend
        environment:
            DATABASE_URL: postgres://postgres:postgres@database:5432/employee_training
        ports:
            - '3001:3001'
        networks:
            - app-network
        depends_on:
            database:
                condition: service_healthy

    frontend:
        build: ./employee-training-frontend
        ports:
            - '3000:3000'
        networks:
            - app-network
        depends_on:
            - backend

networks:
    app-network:
        driver: bridge